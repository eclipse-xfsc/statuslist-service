{{- if eq (get (default dict .Values.podAnnotations) "inject.xfsc.io/enabled") "true" }}
{{- $secretName := printf "%s-postgres-credentials" .Release.Name -}}
{{- $remoteKey := "ocm-wstack/system/postgres" -}}

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao
    kind: SecretStore

  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Delete

  data:
    - secretKey: username
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

    - secretKey: password
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}